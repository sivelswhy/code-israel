name: CodeIsrael
options:
  bundleIdPrefix: com.codeisrael
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: fr
  createIntermediateGroups: true

packages:
  CodeIsraelKit:
    path: CodeIsraelKit

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  CodeIsrael:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: App/Resources/Data
        type: folder
        buildPhase: resources
      - path: App/Resources/Images
        type: folder
        buildPhase: resources
      - path: App/Resources/Sounds
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Code Israël
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codeisrael.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: CodeIsraelKit

  CodeIsraelMac:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: App/Resources/Data
        type: folder
        buildPhase: resources
      - path: App/Resources/Images
        type: folder
        buildPhase: resources
      - path: App/Resources/Sounds
        type: folder
        buildPhase: resources
    entitlements:
      path: App/CodeIsraelMac.entitlements
    info:
      path: App/Info-macOS.plist
      properties:
        CFBundleDisplayName: Code Israël
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        LSMinimumSystemVersion: "14.0"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codeisrael.mac
        PRODUCT_NAME: CodeIsrael
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - package: CodeIsraelKit
